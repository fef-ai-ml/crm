name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  dotnet:
    name: build + unit/arch/contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - run: dotnet restore Crm.sln
      - run: dotnet build Crm.sln --no-restore -c Release -warnaserror
      - run: dotnet test Crm.sln --no-build -c Release --filter "Category!=Integration" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults

  integration:
    name: integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Crm.sln
      - run: dotnet test Crm.sln --no-restore --filter "Category=Integration" --logger trx --results-directory TestResults
        env:
          MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults

  contracts:
    name: docs check, OpenAPI drift, compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python3 tools/docs_check.py
      - name: tooling unit tests (compose_check, observability assets, image pins)
        run: python3 -m unittest discover -s tools/tests -v
      - name: export OpenAPI and diff against committed document (CT-001)
        run: |
          mkdir -p build
          dotnet run --project src/Hosts/Crm.Api -c Release --no-launch-profile -- --export-openapi "$(pwd)/build/openapi.json"
          diff -u docs/api/openapi.json build/openapi.json
        env:
          ConnectionStrings__Crm: "Server=localhost;Database=crm;User Id=sa;Password=unused;TrustServerCertificate=True"
          Redis__Configuration: "localhost:6379"
          Kafka__BootstrapServers: "localhost:9092"
          Auth__SigningKey: "openapi-export-only-0123456789abcdef0123456789"
      - name: validate compose files
        run: |
          cp deploy/.env.example deploy/.env
          base="docker compose --project-directory deploy -f deploy/docker-compose.yml"
          obs="$base -f deploy/docker-compose.observability.yml --profile observability"
          $base config -q
          $base config --format json | python3 tools/compose_check.py
          $obs config -q
          $obs config --format json | python3 tools/compose_check.py --observability

  web:
    name: web lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosts/Crm.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Hosts/Crm.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run

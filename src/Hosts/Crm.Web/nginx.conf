server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ${RESOLVER_ADDRESS} is substituted at container start (docker-entrypoint.d/40-resolve-nameserver.sh)
  # from this container's own /etc/resolv.conf, since the embedded DNS address is 127.0.0.11 on Docker
  # and most Podman networks but not guaranteed on every engine. A variable proxy_pass forces nginx to
  # resolve `api` per request via this resolver instead of once at worker start, so restarting the api
  # container does not 502 this proxy until web is also restarted.
  resolver ${RESOLVER_ADDRESS} valid=10s ipv6=off;

  location /v1/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
